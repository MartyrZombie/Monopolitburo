name: Quality check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fonts and tools
        timeout-minutes: 12
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo timeout 300 apt-get $APT update -qq
          sudo timeout 300 apt-get $APT install -y -qq --no-install-recommends xfonts-scalable poppler-utils
          mkdir -p "$HOME/fonts/poppins"
          for w in Bold Medium; do
            curl -sSfL --retry 3 --max-time 60 -o "$HOME/fonts/poppins/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
          done
          echo "POPPINS_DIR=$HOME/fonts/poppins" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build PDFs
        run: python src/build_package.py

      - name: Run quality checks
        env:
          QC_RELEASE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: python src/qc.py

      - name: Preview the update pack against the latest release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::warning title=Update pack preview failed::$BASH_COMMAND (line $LINENO)"' ERR
          mkdir -p prev
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          if [ -z "$tag" ]; then echo "::notice title=Update pack preview::No previous release to compare with."; exit 0; fi
          gh release download "$tag" --dir prev --pattern '*.pdf'
          echo "Downloaded $(ls prev | wc -l) files from $tag" 
          {
            echo "## Update pack preview: changes since $tag"
            echo
            python src/update_pack.py prev "$tag" > /dev/null
            cat out/update-notes.md
            echo
            echo "<details><summary>Page-by-page comparison</summary>"
            echo
            echo '```'
            python src/pdfdiff.py prev out
            echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # one-line result on the run page (and readable through the API)
          echo "::notice title=Update pack preview vs $tag::$(head -c 900 out/update-notes.md | tr '\n' ' ')"

      - name: Upload update pack preview
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: update-pack-preview
          path: out/*Update_from*.pdf
          if-no-files-found: ignore
