name: Quality check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfonts-scalable poppler-utils
          mkdir -p "$HOME/fonts/poppins"
          for w in Bold Medium; do
            curl -sSfL -o "$HOME/fonts/poppins/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
          done
          echo "POPPINS_DIR=$HOME/fonts/poppins" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build PDFs
        run: python src/build_package.py

      - name: Run quality checks
        env:
          QC_RELEASE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: python src/qc.py

      - name: Compare with the latest release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release download --dir prev --pattern '*.pdf' 2>/dev/null; then
            tag=$(gh release view --json tagName -q .tagName)
            {
              echo "## Changes since $tag"
              echo
              echo '```'
              python src/pdfdiff.py prev out
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous release to compare with."
          fi
