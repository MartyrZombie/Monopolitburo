name: Build print files

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fonts and tools
        timeout-minutes: 12
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo timeout 300 apt-get $APT update -qq
          sudo timeout 300 apt-get $APT install -y -qq --no-install-recommends xfonts-scalable poppler-utils
          mkdir -p "$HOME/fonts/poppins"
          for w in Bold Medium; do
            curl -sSfL --retry 3 --max-time 60 -o "$HOME/fonts/poppins/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
          done
          echo "POPPINS_DIR=$HOME/fonts/poppins" >> "$GITHUB_ENV"
          echo "TYPE1_DIR=/usr/share/fonts/X11/Type1" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Read VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDFs
        run: python src/build_package.py

      - name: Quality gate
        env:
          QC_RELEASE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: python src/qc.py

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: monopolitburo-print-files
          path: out/*.pdf

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          grep -q "^## $TAG" CHANGELOG.md || { echo "CHANGELOG.md has no '## $TAG' section"; exit 1; }
          trap 'echo "::error title=Release failed::$BASH_COMMAND (line $LINENO)"' ERR
          # update pack: only the pages that changed since the previous release
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          : > out/update-notes.md
          if [ -n "$prev" ]; then
            mkdir -p prev && gh release download "$prev" --dir prev --pattern '*.pdf'
            python src/update_pack.py prev "$prev"
          fi
          {
            echo "Print **MONOPOLITBURO_${TAG}_Complete.pdf** for everything. Page 1 is the checklist by paper type."
            echo
            echo
            cat out/update-notes.md
            echo
            echo "## What changed"
            awk -v v="## $TAG" 'index($0, v) == 1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md
          } > release-notes.md
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" out/*.pdf --target "$GITHUB_SHA" \
            --title "MONOPOLITBURO $TAG" --notes-file release-notes.md $prerelease
