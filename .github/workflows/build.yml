name: Build print files

on:
  push:
    branches: [develop, main]
  release:
    types: [published]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfonts-scalable
          mkdir -p "$HOME/fonts/poppins"
          for w in Bold Medium; do
            curl -sSfL -o "$HOME/fonts/poppins/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
          done
          echo "POPPINS_DIR=$HOME/fonts/poppins" >> "$GITHUB_ENV"
          echo "TYPE1_DIR=/usr/share/fonts/X11/Type1" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check release tag matches VERSION
        if: github.event_name == 'release'
        run: |
          file="v$(cat VERSION | tr -d '[:space:]')"
          if [ "$file" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION file ($file)"; exit 1
          fi

      - name: Build PDFs
        run: python src/build_package.py

      - name: Add board stickers
        run: cp print/board-stickers/*.pdf out/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: monopolitburo-print-files
          path: out/*.pdf

      - name: Attach print files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Print **MONOPOLITBURO_${GITHUB_REF_NAME}_Complete.pdf** for everything. Page 1 is the checklist by paper type."
            echo
            awk -v v="## $GITHUB_REF_NAME" 'index($0, v) == 1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md
          } > release-notes.md
          gh release upload "$GITHUB_REF_NAME" out/*.pdf --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
