name: Build print files

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfonts-scalable
          mkdir -p "$HOME/fonts/poppins"
          for w in Bold Medium; do
            curl -sSfL -o "$HOME/fonts/poppins/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
          done
          echo "POPPINS_DIR=$HOME/fonts/poppins" >> "$GITHUB_ENV"
          echo "TYPE1_DIR=/usr/share/fonts/X11/Type1" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file="v$(cat VERSION | tr -d '[:space:]')"
          if [ "$file" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file)"; exit 1
          fi

      - name: Build PDFs
        run: python src/build_package.py

      - name: Add board stickers
        run: cp print/board-stickers/*.pdf out/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: monopolitburo-print-files
          path: out/*.pdf

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## $GITHUB_REF_NAME" '$0 ~ "^"v {f=1; next} /^## v/ {f=0} f' CHANGELOG.md)
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/*.pdf \
            --title "MONOPOLITBURO $GITHUB_REF_NAME" \
            --notes "Print MONOPOLITBURO_${GITHUB_REF_NAME}_Complete.pdf for everything. Page 1 is the checklist by paper type.

$notes" $prerelease
